<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Apples to Apples</title>
<meta name="description" content="A higher-or-lower game built on a century of real restaurant menus from the New York Public Library.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8D%8E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="masthead">
  <h1>Big Apples to Apples</h1>
  <p class="tagline">A century of menus from the New York Public Library, compared anyway.</p>
  <p class="score">Streak <strong id="streak">0</strong><span id="best-wrap" hidden>
    <span class="score-sep">&middot;</span> <span id="best-label">Best</span>
    <strong id="best">0</strong></span></p>
</header>

<main>
  <div class="modes" role="group" aria-label="Game mode">
    <button type="button" id="mode-daily" class="mode is-on" aria-pressed="true">Daily</button>
    <button type="button" id="mode-endless" class="mode" aria-pressed="false">Endless</button>
  </div>

  <p class="mode-note" id="mode-note"></p>

  <div class="years" id="years" hidden>
    <div class="years-row">
      <label for="year-from">From</label>
      <input type="range" id="year-from" step="1">
      <output for="year-from" id="from-label"></output>
    </div>
    <div class="years-row">
      <label for="year-to">To</label>
      <input type="range" id="year-to" step="1">
      <output for="year-to" id="to-label"></output>
    </div>
    <p class="years-count" id="years-count"></p>
  </div>

  <div class="board is-loading" id="board">
    <article class="card" id="left">
      <p class="dish"></p>
      <p class="meta"><span class="restaurant"></span><span class="year"></span></p>
      <div class="price-block">
        <p class="price"></p>
        <p class="fact is-empty">&nbsp;</p>
      </div>
    </article>

    <p class="versus" aria-hidden="true">vs</p>

    <article class="card" id="right">
      <p class="dish"></p>
      <p class="meta"><span class="restaurant"></span><span class="year"></span></p>
      <div class="price-block">
        <p class="price is-hidden"></p>
        <p class="fact is-empty">&nbsp;</p>
      </div>
    </article>
  </div>

  <p class="prompt" id="prompt">Dealing the first two dishes&hellip;</p>

  <div class="controls" id="controls" hidden>
    <button type="button" id="higher">Higher</button>
    <button type="button" id="lower">Lower</button>
  </div>

  <div class="gameover" id="gameover" hidden>
    <p class="gameover-line">Dinner's over.</p>
    <p class="gameover-streak">Final streak <strong id="final-streak">0</strong></p>
    <p class="gameover-note" id="final-note"></p>
    <div class="gameover-actions">
      <button type="button" id="again">Play again</button>
      <button type="button" id="share" class="secondary">Share</button>
    </div>
  </div>

  <p class="visually-hidden" id="status" role="status" aria-live="polite"></p>
</main>

<footer>
  <p>Menu data: The New York Public Library,
    <a href="https://www.nypl.org/research/support/whats-on-the-menu">What's on the Menu?</a>
    Prices are as printed on the menu.</p>
</footer>

<script type="module" src="js/game.js"></script>
</body>
</html>
